services:
  - type: web
    name: ai-code-review-worker
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run worker
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: AI_RATE_LIMIT_MAX
        value: "10"
      - key: AI_RATE_LIMIT_DURATION_MS
        value: "60000"
      # BullMQ's default 30s lock can mark long AI reviews as stalled while
      # they are still inside provider calls. This value follows the 15m
      # staged-review ceiling plus 2m of headroom.
      - key: REVIEW_BULLMQ_LOCK_DURATION_MS
        value: "1020000"
      - key: REVIEW_BULLMQ_STALLED_INTERVAL_MS
        value: "60000"
      - key: REVIEW_BULLMQ_MAX_STALLED_COUNT
        value: "3"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        sync: false
      # The review is one call by one model now, so this is the model, and it
      # is the strongest one available rather than the fastest.
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      # Distinct from NVIDIA_MODEL on purpose: this is what a chunk fails over
      # to after the primary refuses it twice, so it must be a different,
      # known-good model, not a copy of the one that just failed.
      - key: NVIDIA_BACKUP_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: REVIEW_PRIMARY_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      # ultra-550b with reasoning on measured outputTokens:0 and a connection
      # timeout on every attempt as a verifier (see src/lib/ai/models.ts) —
      # super-120b is the model that actually verifies.
      - key: REVIEW_VERIFIER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: REVIEW_ARBITER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_TEMPERATURE
        value: "0.2"
      - key: NVIDIA_TOP_P
        sync: false
      - key: NVIDIA_MAX_TOKENS
        value: "8192"
      # Reasoning ON: with no second model re-checking findings, this is the
      # only precision control there is. Measured on this endpoint at 22.6s
      # for a small diff, well inside the request timeout below.
      - key: NVIDIA_THINKING
        value: "true"
      # Reasoning happens before the first token, so the ceiling has to cover
      # thinking time plus the answer. 120s aborted the call partway.
      - key: NVIDIA_REQUEST_TIMEOUT_MS
        value: "300000"
      # Independent provider fallback used by review generation, staged
      # verification/arbitration, and finding-thread replies.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: OPENROUTER_REQUEST_TIMEOUT_MS
        value: "120000"
      - key: OPENROUTER_APP_NAME
        value: PRSentry
      - key: REVIEW_FINDINGS_TOOL_ROUNDS
        value: "2"
      # A large PR is now ~24 smaller calls rather than 8 oversized ones, four
      # at a time. Measured on a 458-file PR: 504s to reach 260 files. At 420s
      # the tail of a big PR is cut off by the clock and reported unreviewed,
      # which is the failure this chunking change exists to remove.
      - key: REVIEW_DEADLINE_MS
        value: "600000"
      - key: REVIEW_RISKY_DEADLINE_MS
        value: "600000"
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
