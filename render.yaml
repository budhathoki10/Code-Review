services:
  - type: web
    name: ai-code-review-worker
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run worker
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: AI_RATE_LIMIT_MAX
        value: "10"
      - key: AI_RATE_LIMIT_DURATION_MS
        value: "60000"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_TEMPERATURE
        value: "0.2"
      - key: NVIDIA_TOP_P
        sync: false
      - key: NVIDIA_MAX_TOKENS
        value: "8192"
      - key: NVIDIA_THINKING
        value: "true"
      - key: REVIEW_FINDINGS_TOOL_ROUNDS
        value: "1"
      - key: REVIEW_VERIFICATION_MAX_FINDINGS
        value: "3"
      - key: REVIEW_DEADLINE_MS
        value: "180000"
      - key: REVIEW_RISKY_DEADLINE_MS
        value: "240000"
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
