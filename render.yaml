services:
  - type: web
    name: ai-code-review-worker
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm run worker
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: AI_RATE_LIMIT_MAX
        value: "10"
      - key: AI_RATE_LIMIT_DURATION_MS
        value: "60000"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        sync: false
      # The review is one call by one model now, so this is the model, and it
      # is the strongest one available rather than the fastest.
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_TEMPERATURE
        value: "0.2"
      - key: NVIDIA_TOP_P
        sync: false
      - key: NVIDIA_MAX_TOKENS
        value: "8192"
      # Reasoning ON: with no second model re-checking findings, this is the
      # only precision control there is. Measured on this endpoint at 22.6s
      # for a small diff, well inside the request timeout below.
      - key: NVIDIA_THINKING
        value: "true"
      # Reasoning happens before the first token, so the ceiling has to cover
      # thinking time plus the answer. 120s aborted the call partway.
      - key: NVIDIA_REQUEST_TIMEOUT_MS
        value: "300000"
      - key: REVIEW_FINDINGS_TOOL_ROUNDS
        value: "2"
      - key: REVIEW_DEADLINE_MS
        value: "420000"
      - key: REVIEW_RISKY_DEADLINE_MS
        value: "480000"
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
