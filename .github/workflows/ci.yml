name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Lint, build, unit & e2e tests
    runs-on: ubuntu-latest

    # Test-only values — not real secrets. Sufficient for lint/build/unit
    # tests and for the e2e suite, which is scoped to webhook paths that
    # resolve before any database/queue call (see e2e/webhook.spec.ts).
    env:
      GITHUB_WEBHOOK_SECRET: e2e-test-webhook-secret
      AUTH_SECRET: ci-placeholder-auth-secret
      AUTH_URL: http://localhost:3100
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: ai_code_review_ci
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
